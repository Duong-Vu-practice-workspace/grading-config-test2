replicaCount: 1

image:
  repository: vucongtuanduong/grading-notification
  tag: "latest"
  pullPolicy: Always

service:
  port: 8085

spring:
  profilesActive: stg

config:
  serverUrl: "http://config-server:8086"

secrets:
  dbSecret: "db-secret"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
